spring.application.name=api

# Porta interna do container (o compose publica em API_PORT do .env).
# É o padrão do Spring, mas fica explícita por ser parte do contrato com o compose
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate só CONFERE se as classes de model/ batem com as tabelas.
# Nunca cria nem altera nada: o schema é do create_tables.sql
spring.jpa.hibernate.ddl-auto=validate

# Desliga um recurso que mantém a conexão do banco aberta até o fim da resposta HTTP
# (o Spring avisa no log se ficar ligado)
spring.jpa.open-in-view=false

# Endereço do serviço Python
biometria.url=${BIOMETRIA_URL}