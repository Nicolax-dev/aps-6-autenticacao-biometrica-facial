<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — APS6</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <main class="cartao">

        <section id="tela-login">
            <h1>Entrar</h1>

            <form id="form-login" novalidate>

                <div id="erro-login" class="erro-geral" hidden></div>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" autocomplete="username">
                    <small id="erro-email" class="erro-campo"></small>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" autocomplete="current-password">
                    <small id="erro-senha" class="erro-campo"></small>
                </div>

                <button type="submit" id="botao-continuar" class="botao">Continuar</button>
            </form>

            <p><a href="cadastro.html">Criar cadastro</a> · <a href="index.html">Voltar ao início</a></p>
        </section>

        <section id="tela-resultado" hidden>
            <h1 id="saudacao"></h1>

            <h2 class="subtitulo">Informações disponíveis</h2>
            <ul id="lista-informacoes" class="lista-informacoes"></ul>

            <div class="acoes">
                <button type="button" id="botao-sair" class="botao secundario">Sair</button>
            </div>
        </section>
    </main>

    <dialog id="popup-foto" class="popup">
        <h2>Confirme sua identidade</h2>

        <div class="captura-foto">
            <p class="dica">Olhe para a câmera, com expressão neutra e boa iluminação.</p>

            <video id="video-camera" autoplay playsinline muted hidden></video>
            <img id="preview-foto" alt="Foto capturada" hidden>

            <div class="acoes">
                <button type="button" id="botao-ligar-camera" class="botao">Ligar câmera</button>
                <button type="button" id="botao-capturar" class="botao" hidden>Tirar foto</button>
                <button type="button" id="botao-tirar-outra" class="botao secundario" hidden>Tirar outra</button>
            </div>
        </div>

        <div id="erro-popup" class="erro-geral" hidden></div>

        <div class="acoes">
            <button type="button" id="botao-cancelar" class="botao secundario">Cancelar</button>
            <!-- Desabilitado até existir uma foto capturada -->
            <button type="button" id="botao-entrar" class="botao" disabled>Entrar</button>
        </div>
    </dialog>

    <!-- Ordem importa: cada arquivo usa o que os anteriores definiram -->
    <script src="js/mensagens.js"></script>
    <script src="js/captura-foto.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
